services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: chiffra-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chiffra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chiffra}
      POSTGRES_DB: ${POSTGRES_DB:-chiffra}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chiffra} -d ${POSTGRES_DB:-chiffra}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: chiffra-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: chiffra-api
    command: ["sh", "-c", "npm run migrate -w @chiffra/api && npm run dev -w @chiffra/api"]
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 4000
      DATABASE_URL: ${DATABASE_URL:-postgres://chiffra:chiffra@postgres:5432/chiffra}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      LLM_URL: ${LLM_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-replace-me}
      LLM_MODEL: ${LLM_MODEL:-gpt-5.5}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-replace-me}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-https://example.cognitiveservices.azure.com/}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-12-01-preview}
      AZURE_OPENAI_DEPLOYMENT_NAME: ${AZURE_OPENAI_DEPLOYMENT_NAME:-gpt-4.1}
      AZURE_OPENAI_MAX_TOKENS: ${AZURE_OPENAI_MAX_TOKENS:-16384}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-embedder-small-3}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-512}
    ports:
      - "4000:4000"
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: chiffra-worker
    command: ["npm", "run", "worker", "-w", "@chiffra/api"]
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 4000
      DATABASE_URL: ${DATABASE_URL:-postgres://chiffra:chiffra@postgres:5432/chiffra}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      LLM_URL: ${LLM_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-replace-me}
      LLM_MODEL: ${LLM_MODEL:-gpt-5.5}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-replace-me}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-https://example.cognitiveservices.azure.com/}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-12-01-preview}
      AZURE_OPENAI_DEPLOYMENT_NAME: ${AZURE_OPENAI_DEPLOYMENT_NAME:-gpt-4.1}
      AZURE_OPENAI_MAX_TOKENS: ${AZURE_OPENAI_MAX_TOKENS:-16384}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-embedder-small-3}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-512}
    volumes:
      - .:/app
      - worker_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: chiffra-web
    environment:
      VITE_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  api_node_modules:
  worker_node_modules:
  web_node_modules:
